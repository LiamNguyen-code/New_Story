# Cấu hình Nginx đang chạy trên VPS (newsandtales.com qua Cloudflare, SSL mode "Full (strict)").
# deploy/nginx.conf là mẫu ban đầu (chạy bằng IP, chưa HTTPS); file này là bản sau khi gắn tên miền.
#
# Cài đặt:
#   1. Chép file này vào /etc/nginx/sites-available/story
#   2. Lấy chứng chỉ (Cloudflare chưa bật "Always Use HTTPS"):
#        apt-get install -y certbot && mkdir -p /var/www/acme
#        certbot certonly --webroot -w /var/www/acme -d newsandtales.com -d www.newsandtales.com \
#          --deploy-hook "systemctl reload nginx"
#   3. IP thật của người đọc (không có thì mọi người đều mang IP Cloudflare → chặn đăng nhập sai và đếm lượt xem sai):
#        { for u in https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6; do
#            curl -fsS $u | sed "s/^/set_real_ip_from /; s/$/;/"; echo; done
#          echo "real_ip_header CF-Connecting-IP;"; } | grep -v '^$' > /etc/nginx/conf.d/cloudflare-realip.conf
#   4. nginx -t && systemctl reload nginx
#

# HTTP: chỉ phục vụ xác minh certbot, còn lại chuyển sang HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://newsandtales.com$request_uri; }
}

# www -> tên miền chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.newsandtales.com;
    ssl_certificate     /etc/letsencrypt/live/newsandtales.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsandtales.com/privkey.pem;
    return 301 https://newsandtales.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name newsandtales.com;
    ssl_certificate     /etc/letsencrypt/live/newsandtales.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsandtales.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Truy cập bằng IP / tên miền lạ -> về tên miền chính
    if ($host != "newsandtales.com") { return 301 https://newsandtales.com$request_uri; }

    client_max_body_size 20m;   # upload ảnh bìa

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Ảnh bìa đã upload: Nginx trả thẳng, không qua Node
    location /uploads/ {
        alias /var/lib/story/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # CSS/JS/ảnh đã build có hash trong tên file
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
