# Mẫu cấu hình Nginx (setup-vps.sh điền __SERVER_NAME__, __DATA_DIR__, __PORT__).
# certbot sẽ tự thêm phần HTTPS vào file này.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;   # upload ảnh bìa

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Ảnh bìa đã upload: Nginx trả thẳng, không qua Node
    location /uploads/ {
        alias __DATA_DIR__/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # CSS/JS/ảnh đã build có hash trong tên file
    location /_astro/ {
        proxy_pass http://127.0.0.1:__PORT__;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
