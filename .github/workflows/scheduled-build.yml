# Build lại site mỗi ngày 1 lần (khoảng 30 lần build/tháng):
#  - truyện hẹn giờ (publishDate trong tương lai) tự xuất hiện
#  - các thay đổi đã lưu trong admin nhưng quên bấm "Đăng lên site" cũng được đăng
# Cần secret CF_DEPLOY_HOOK = Deploy Hook URL của Cloudflare Pages
# (Pages project → Settings → Builds → Deploy hooks). Chưa đặt secret thì workflow tự bỏ qua.
name: Daily rebuild

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 07:00 giờ Việt Nam
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK chưa được đặt, bỏ qua."; exit 0; fi
          curl -fsS -X POST "$HOOK"
